# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Проклятье красной полосы"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ru-RU
  baseUrl: toster69.github.io/avolar
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Josefin Sans  # Геометрический Арт-деко шрифт (элегантность и строгость)
      body: Jost            # Индустриальный шрифт начала 20-го века, без засечек
      code: JetBrains Mono  # Строгий технический шрифт
    colors:
      lightMode:
        light: "#F5F4F0"           # Чистая матовая бумага (досье)
        lightgray: "#E1DCE3"       # Светло-серый с легким фиолетовым отливом (рамки)
        gray: "#857E94"            # Приглушенный фиолетово-серый (иконки/мета)
        darkgray: "#2C2A35"        # Основной текст: цвет темного графита
        dark: "#0B1528"            # Заголовки: очень темный синий
        secondary: "#D4AF37"       # Золото (ссылки)
        tertiary: "#C8102E"        # КРАСНАЯ ПОЛОСА (наведение/акценты)
        highlight: rgba(30, 58, 138, 0.1) # Сине-фиолетовая легкая подсветка фона
        textHighlight: "#C8102E33" # Выделение текста красным маркером
      darkMode:
        light: "#0D0F16"           # Фон: Глубокий, нуарный сине-черный
        lightgray: "#1C1E2A"       # Рамки: Темный графит с синевой
        gray: "#544B66"            # Иконки/Границы: Тусклый фиолетовый
        darkgray: "#D1CDD6"        # Основной текст: Читаемый светло-серый
        dark: "#F4F1F8"            # Заголовки: Чистый, контрастный белый (Арт-деко стиль)
        secondary: "#D4AF37"       # ЗОЛОТО (Ссылки, папки, графы)
        tertiary: "#C8102E"        # КРАСНАЯ ПОЛОСА (Наведение, активные элементы)
        highlight: rgba(107, 76, 173, 0.25) # Фиолетовая неоновая подсветка активных зон
        textHighlight: "#D4AF3766" # Выделение текста золотым
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false # ОСТАВЛЯЕМ ВЫКЛЮЧЕННЫМ, чтобы работали наши стили
    options:
      theme: its-theme
      variation: ttrpg-dnd
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/bases-page"
    enabled: true
    order: 50
  - source: github:Requiae/quartz-leaflet-bases-plugin
    enabled: true
    options:
      enableCopyTool: false
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50

  # ================= РАСПОЛОЖЕНИЕ ЭЛЕМЕНТОВ (LAYOUT) =================
  
  # --- ЛЕВАЯ ПАНЕЛЬ ---
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 40
      group: toolbar
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50

  # --- ПРАВАЯ ПАНЕЛЬ ---
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 20
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 30

  # --- ЦЕНТР (НАД ТЕКСТОМ) ---
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 30
      display: all
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 40

  # --- ПОДВАЛ И ПРОЧЕЕ ---
  - source: "@quartz-community/spacer"
    enabled: true
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 10

layout:
  groups:
    toolbar:
      priority: 20
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}